name: Tool Rack v1 Acceptance

on:
  push:
    branches:
      - tachyos-tool-rack-v1
  workflow_dispatch:

jobs:
  tool-rack:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout isolated Tool Rack surfaces
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            strategy_core
            tests/tool_rack
            nautilus_vnext
            docs
            CHECK_TOOL_RACK_V1.py
            00_CHECK_TOOL_RACK_SHADOW.cmd
            START_TOOL_RACK_SHADOW.cmd
            TOOL_RACK_ATTACH_R22_SHADOW.py
            TOOL_RACK_SHADOW_REPLAY.py
            TOOL_RACK_COMPARE_SHADOW_TO_PAPER.py
            02_COMPARE_SHADOW_TO_PAPER.cmd
            README_TOOL_RACK_SHADOW.md
            BUILD_TOOL_RACK_SHADOW_BUNDLE.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run isolated Tool Rack acceptance suite
        run: python CHECK_TOOL_RACK_V1.py

      - name: Build whitelisted read-only shadow bundle
        run: python BUILD_TOOL_RACK_SHADOW_BUNDLE.py --output TACHYOS_TOOL_RACK_V1_SHADOW_VALIDATION.zip

      - name: Upload shadow-validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: tachyos-tool-rack-shadow-validation
          path: TACHYOS_TOOL_RACK_V1_SHADOW_VALIDATION.zip
          if-no-files-found: error
          retention-days: 14
