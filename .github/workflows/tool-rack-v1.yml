name: Tool Rack v1 Acceptance

on:
  push:
    branches:
      - tachyos-tool-rack-v1
  workflow_dispatch:

jobs:
  tool-rack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run isolated Tool Rack acceptance suite
        run: python CHECK_TOOL_RACK_V1.py
