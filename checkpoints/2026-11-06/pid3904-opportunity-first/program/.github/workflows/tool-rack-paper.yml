name: Tool Rack standalone PAPER acceptance

on:
  push:
    branches:
      - tachyos-tool-rack-paper-v1
      - tachyos-tool-rack-pid16280-corrections-20261027
      - tachyos-tool-rack-pid13432-mountain-redo-20261027
      - tachyos-tool-rack-pid7516-entries-runners-20261027
      - tachyos-tool-rack-pid10092-looking-glass-20261027
      - tachyos-tool-rack-pid10092-missions-20261028
      - tachyos-tool-rack-pid10092-restart-finality-20261028
  pull_request:
    branches:
      - tachyos-tool-rack-paper-v1
      - tachyos-tool-rack-pid16280-corrections-20261027
      - tachyos-tool-rack-pid13432-mountain-redo-20261027
      - tachyos-tool-rack-pid7516-entries-runners-20261027
      - tachyos-tool-rack-pid10092-looking-glass-20261027
      - tachyos-tool-rack-pid10092-missions-20261028
      - tachyos-tool-rack-pid10092-restart-finality-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    if: >-
      github.ref == 'refs/heads/tachyos-tool-rack-paper-v1' ||
      github.ref == 'refs/heads/tachyos-tool-rack-pid16280-corrections-20261027' ||
      github.ref == 'refs/heads/tachyos-tool-rack-pid13432-mountain-redo-20261027' ||
      github.ref == 'refs/heads/tachyos-tool-rack-pid7516-entries-runners-20261027' ||
      github.ref == 'refs/heads/tachyos-tool-rack-pid10092-looking-glass-20261027' ||
      github.ref == 'refs/heads/tachyos-tool-rack-pid10092-missions-20261028' ||
      github.ref == 'refs/heads/tachyos-tool-rack-pid10092-restart-finality-20261028' ||
      github.base_ref == 'tachyos-tool-rack-paper-v1' ||
      github.base_ref == 'tachyos-tool-rack-pid16280-corrections-20261027' ||
      github.base_ref == 'tachyos-tool-rack-pid13432-mountain-redo-20261027' ||
      github.base_ref == 'tachyos-tool-rack-pid7516-entries-runners-20261027' ||
      github.base_ref == 'tachyos-tool-rack-pid10092-looking-glass-20261027' ||
      github.base_ref == 'tachyos-tool-rack-pid10092-missions-20261028' ||
      github.base_ref == 'tachyos-tool-rack-pid10092-restart-finality-20261028'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Checkout isolated PAPER branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /strategy_core/
            /tests/tool_rack/
            /tests/__init__.py
            /.gitattributes
            /TOOL_RACK_PAPER.py
            /TOOL_RACK_EXPORT.py
            /TOOL_RACK_RECONCILE.py
            /CHECK_TOOL_RACK_PAPER.py
            /BUILD_TOOL_RACK_PAPER_BUNDLE.py
            /01_START_TOOL_RACK_PAPER_90M.cmd
            /02_CHECK_TOOL_RACK_PAPER.cmd
            /03_INSTALL_TOOL_RACK_DEPENDENCIES.cmd
            /04_EXPORT_LAST_TOOL_RACK_RUN.cmd
            /05_RECONCILE_PREVIOUS_TOOL_RACK_RUN.cmd
            /requirements_tool_rack_paper.txt
            /README_TOOL_RACK_PAPER.md
            /TACHYOS_STRATEGY_BACKBONE_V1.md
            /docs/
            /.github/workflows/tool-rack-paper.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_tool_rack_paper.txt

      - name: Install explicit market-data dependencies
        run: python -m pip install -r requirements_tool_rack_paper.txt

      - name: Check independent tools and real PAPER execution
        run: python CHECK_TOOL_RACK_PAPER.py

      - name: Check Nautilus browser sources
        run: |
          node --check strategy_core/nautilus/app.js
          node --check strategy_core/nautilus/chart.js
          node --check strategy_core/nautilus/bridge.js
          node --check strategy_core/nautilus/reliability-ui.js
          node tests/tool_rack/test_nautilus_looking_glass.js
          node tests/tool_rack/test_pid10092_nautilus_missions.js

      - name: Build and test extracted standalone bundle
        run: python BUILD_TOOL_RACK_PAPER_BUNDLE.py --output TACHYOS_TOOL_RACK_PID10092_MISSIONS_RESTART_FIX.zip

      - name: Upload checked PAPER bundle
        uses: actions/upload-artifact@v4
        with:
          name: tachyos-tool-rack-pid10092-missions-restart-fix-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: TACHYOS_TOOL_RACK_PID10092_MISSIONS_RESTART_FIX.zip
          if-no-files-found: error
          retention-days: 14
